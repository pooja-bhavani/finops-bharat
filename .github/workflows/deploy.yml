name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master
      - main

jobs:
  test: 
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build React Frontend
        run: |
          npm ci
          npm run build

      - name: Package Deployment Archive
        run: |
          zip -r deploy.zip Dockerfile package.json package-lock.json index.html vite.config.js src backend .ebextensions

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "finops-bharat"
          environment_name: "Finops-bharat-env"
          version_label: "autodeploy-${{ github.sha }}"
          region: "ap-south-1"
          deployment_package: "deploy.zip"
