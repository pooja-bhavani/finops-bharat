AWSTemplateFormatVersion: '2010-09-09'
Description: 'Creates a Read-Only IAM Role for FinOps-Bharat cross-account audit scans.'

Parameters:
  ExternalId:
    Type: String
    Default: 'finops-bharat-audit'
    Description: 'Unique External ID for secure role assumption.'

Resources:
  FinOpsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinOpsBharatReadOnlyRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*' # Allows cross-account trust via ExternalId verification
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

Outputs:
  RoleArn:
    Description: 'Copy and paste this Role ARN into FinOps-Bharat'
    Value: !GetAtt FinOpsReadOnlyRole.Arn