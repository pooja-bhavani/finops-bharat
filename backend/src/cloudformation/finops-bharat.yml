AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only role that lets FinOps-Bharat scan this AWS account.

Parameters:
  TrustedAccountId:
    Type: String
    Description: AWS account ID that runs FinOps-Bharat (pre-filled by the app).
  ExternalId:
    Type: String
    Description: Unique ID generated by FinOps-Bharat for you (pre-filled by the app).

Resources:
  FinOpsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinOpsBharatReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
        - arn:aws:iam::aws:policy/SecurityAudit
      Policies:
        - PolicyName: FinOpsCostAndContainersRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ce:Get*
                  - ce:List*
                  - ce:Describe*
                  - ecr:Describe*
                  - ecr:List*
                  - eks:Describe*
                  - eks:List*
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"

Outputs:
  RoleArn:
    Description: Copy this value into FinOps-Bharat.
    Value: !GetAtt FinOpsRole.Arn